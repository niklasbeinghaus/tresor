name: release-please

# Conventional commits -> release PR (version bump + CHANGELOG) -> merge -> tag + GitHub Release.
# Tag-driven on purpose: tresor ships binaries via GitHub Releases and is not
# published to crates.io, so no registry baseline is needed.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
