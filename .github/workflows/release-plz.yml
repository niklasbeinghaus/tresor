name: release-plz

# Continuous releases from conventional commits:
#   merge to main -> release-plz opens/updates a "release" PR (version bump + CHANGELOG)
#   merging that PR -> release-plz tags + creates the GitHub Release
#   the tag push   -> release.yaml builds and attaches the binaries
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-plz:
    runs-on: ubuntu-latest
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: MarcoIeni/release-plz-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
